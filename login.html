<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập — Mọt Sách</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500;1,9..144,600&family=Literata:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <nav class="nav scrolled" id="mainNav">
      <a href="index.html" class="brand">
        <svg class="mark" viewBox="0 0 30 30" fill="none">
          <path d="M4 6c4-2 8-2 11 0v18c-3-2-7-2-11 0V6z" fill="#C9A24B" />
          <path d="M26 6c-4-2-8-2-11 0v18c3-2 7-2 11 0V6z" fill="#E4C879" />
        </svg>
        Mọt Sách
      </a>
      </div>
      <div class="nav-actions">
        <a href="register.html" class="btn btn-ghost">Chưa có tài khoản?</a>
        <a href="register.html" class="btn btn-gold">Đăng ký</a>
      </div>
    </nav>

    <div class="auth-shell">
      <div class="auth-card">
        <div class="auth-side">
          <a href="index.html" class="back-link">← Quay lại trang chủ</a>
          <div>
            <div class="leaf-deco l1"></div>
            <div class="leaf-deco l2"></div>
            <div class="quote-mark">“</div>
            <p class="auth-quote">
              Mua bán sách dễ dàng chỉ với một lần đăng nhập.
            </p>
            <div class="auth-quote-by">— Mọt Sách</div>
          </div>
          <div
            style="
              font-family: var(--font-mono);
              font-size: 12px;
              color: var(--muted-2);
              letter-spacing: 0.06em;
            "
          >
            Đầu sách, số bản và tình trạng — đồng bộ tức thì
          </div>
        </div>

        <div class="auth-main">
          <div class="tabs">
            <a href="login.html" class="tab-btn active">Đăng nhập</a>
            <a href="register.html" class="tab-btn">Đăng ký</a>
            <div
              class="tab-indicator"
              style="width: 76px; transform: translateX(0px)"
            ></div>
          </div>

          <div class="form-panel active">
            <div class="auth-title">Chào bạn quay lại</div>
            <div class="auth-sub">
              Đăng nhập để tiếp tục quản lý tủ sách của bạn.
            </div>
            <form id="loginForm">
              <div class="field">
                <label for="li-email">Email</label>
                <input
                  id="li-email"
                  type="email"
                  placeholder="ban@vidu.com"
                  required
                />
              </div>
              <div class="field">
                <label for= "li-pass">Mật khẩu</label>
                <input
                  id="li-pass"
                  type="password"
                  placeholder="Nhập mật khẩu"
                  required
                />
              </div>
              <div
                id="li-error"
                style="
                  display: none;
                  color: var(--burgundy);
                  font-size: 13px;
                  margin-bottom: 16px;
                "
              ></div>
              <button class="btn btn-gold btn-wide" type="submit">
                Đăng nhập
              </button>
            </form>
            <div class="switch-line">
              Chưa có tài khoản?
              <a
                href="register.html"
                style="color: var(--burgundy); font-weight: 700"
                >Đăng ký ngay</a
              >
            </div>
            <div
              style="
                margin-top: 14px;
                font-family: var(--font-mono);
                font-size: 12px;
                color: var(--muted-2);
                text-align: center;
              "
            ></div>
          </div>
        </div>
      </div>
    </div>

    <script src="js/login.js"></script>
  </body>
</html>
