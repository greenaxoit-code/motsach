<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cửa hàng sách — Mọt Sách</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500;1,9..144,600&family=Literata:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/shop.css" />
  </head>
  <body>
    <nav class="nav scrolled" id="mainNav">
      <a href="index.html" class="brand">
        <svg class="mark" viewBox="0 0 30 30" fill="none">
          <path d="M4 6c4-2 8-2 11 0v18c-3-2-7-2-11 0V6z" fill="#C9A24B" />
          <path d="M26 6c-4-2-8-2-11 0v18c3-2 7-2 11 0V6z" fill="#E4C879" />
        </svg>
        Mọt Sách
      </a>
      <div class="nav-links">
        <a href="index.html">Trang chủ</a>
        <a href="shop.html" class="active-link">Sách đang bán</a>
        <a href="purchased.html" id="navPurchasesLink" style="display:none;">Sách đã mua</a>
        <a href="admin.html" id="navAdminLink">Quản trị</a>
      </div>

      <span
        id="navWeatherLabel"
        style="
          display: none;
          font-family: var(--font-mono);
          font-size: 12px;
          color: var(--muted-2);
          margin-right: 14px;
          align-self: center;
          white-space: nowrap;
        "
      ></span>
      <span
        id="navUserLabel"
        style="
          display: none;
          font-family: var(--font-mono);
          font-size: 12px;
          color: var(--muted-2);
          margin-right: 10px;
          align-self: center;
        "
      ></span>
      <button class="burger" aria-label="Menu" onclick="handleNavUserClick()">
        <span></span><span></span><span></span>
      </button>
    </nav>

    <section class="section" style="padding-top: 150px;">
      <div class="wrap">
        <div class="section-head">
          <div>
            <span class="kicker">Cửa hàng</span>
            <h2>Tất cả sách đang bán</h2>
          </div>
          <p>Lọc theo tên sách hoặc thể loại để nhanh chóng tìm đúng cuốn bạn cần.</p>
        </div>

        <!-- ================= BỘ LỌC ================= -->
        <div class="book-form-panel open" style="margin-bottom:36px;">
          <div class="form-grid" style="margin-bottom:0; align-items:end;">
            <div class="field">
              <label for="filterTitle">Tìm theo tên sách / tác giả</label>
              <input id="filterTitle" type="text">
            </div>
            <div class="field">
              <label for="filterGenre">Thể loại</label>
              <select id="filterGenre">
                <option value="">Tất cả thể loại</option>
              </select>
            </div>
            <div class="field field-full" style="display:flex; align-items:center; justify-content:space-between; margin-bottom:0; flex-wrap:wrap; gap:12px;">
              <span id="filterResultCount" style="font-family:var(--font-mono); font-size:13px; color:var(--muted-2);"></span>
              <button type="button" class="btn btn-cancel" id="resetFilterBtn">Đặt lại bộ lọc</button>
            </div>
          </div>
        </div>

        <div class="book-grid" id="shopGrid">
          <!-- rendered by JS from localStorage -->
        </div>
      </div>
    </section>

    <script src="js/books.js"></script>
    <script src="js/shop.js"></script>
  </body>
</html>
